; USBMUSIC ESP32 — reproductor Wi-Fi para parlante antiguo
; Framework: Arduino-ESP32 3.x (IDF 5.x) via pioarduino. ESP8266Audio 2.x exige IDF 5.x;
; el paquete oficial platformio/espressif32 trae IDF 4.x y no compila esta libreria.

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = web/index.html
lib_deps =
    earlephilhower/ESP8266Audio @ 2.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=2

; ESP32 clasico (ESP32-WROOM-32 / "D1 Mini ESP32"). Salida: DAC I2S externo PCM5102A.
[env:esp32dev]
board = esp32dev

; Misma placa, salida por el DAC interno de 8 bits (GPIO25/26). Opcion de menor coste.
[env:esp32dev_dac]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DAUDIO_OUTPUT_INTERNAL_DAC=1

; ESP32-C3 "Super Mini". Sin DAC interno: requiere PCM5102A. Pines sin validar en hardware.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_SD_SCK=4
    -DPIN_SD_MISO=5
    -DPIN_SD_MOSI=6
    -DPIN_SD_CS=7
    -DPIN_I2S_BCLK=0
    -DPIN_I2S_LRCK=1
    -DPIN_I2S_DOUT=3
    -DPIN_RESET_BUTTON=9
